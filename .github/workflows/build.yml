name: Compilar Radial Menu (Windows .exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar radial_menu.exe
        working-directory: src
        run: |
          pyinstaller --noconfirm --onefile --windowed --name RadialMenu ^
            --add-data "config.json;." ^
            --add-data "icons;icons" ^
            radial_menu.py

      - name: Compilar Editor.exe
        working-directory: src
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Editor ^
            --add-data "config.json;." ^
            --add-data "icons;icons" ^
            editor.py

      - name: Preparar carpeta portable
        run: |
          mkdir RadialMenu_Portable
          copy src\dist\RadialMenu.exe RadialMenu_Portable\
          copy src\dist\Editor.exe RadialMenu_Portable\
          copy src\config.json RadialMenu_Portable\
          xcopy src\icons RadialMenu_Portable\icons\ /E /I /Y

      - name: Subir resultado (descargable desde la pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: RadialMenu_Portable
          path: RadialMenu_Portable/
